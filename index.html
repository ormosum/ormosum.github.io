<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image</title>
  <style>
    /* Container prevents image from stretching beyond its wrapper */
    .img-container {
      width: 100%;
      max-width: 1000px; /* Optional cap for desktop screens */
      margin: 0 auto;
    }

    /* Core responsive CSS logic */
    .responsive-img {
      max-width: 100%;  /* Ensures image never exceeds screen width */
      height: auto;     /* Maintains correct aspect ratio */
      display: block;   /* Eliminates bottom gap whitespace */
    }
  </style>
</head>
<body>

  <div class="img-container">
    <!-- img src="https://via.placeholder.com/800x600" alt="Responsive Example" class="responsive-img"-->
    <img src="images/a.JPG" alt="Responsive Example" class="responsive-img">
  </div>

</body>
</html>
